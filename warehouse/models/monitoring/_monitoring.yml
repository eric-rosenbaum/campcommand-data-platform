version: 2

models:
  - name: mon_event_delivery
    description: Duplicates, late arrivals and clock corrections per device per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tenant_id, device_id, received_date]

  - name: mon_ingestion_quality
    description: >
      Per camp and feed: files and rows received, loaded and quarantined,
      and how many quarantined rows are still waiting on the camp.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tenant_id, feed]
