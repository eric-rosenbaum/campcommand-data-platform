version: 2

sources:
  - name: raw
    description: >
      Landed by the ingestion framework (reference feeds and store sales,
      after contract validation) and by the sync endpoint (app events, as
      uploaded). Append-only.
    schema: raw
    tables:
      - name: buildings
      - name: assets
      - name: staff
      - name: commissary_transactions
      - name: app_events
        description: >
          Every event every device uploaded, including retries. At-least-once:
          the same event_id can appear in several uploads.
        config:
          loaded_at_field: received_at
          freshness:
            warn_after: {count: 2, period: day}
      - name: ingest_batches
      - name: quarantine
