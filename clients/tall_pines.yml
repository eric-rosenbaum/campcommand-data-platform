tenant_id: tall_pines
name: Camp Tall Pines
timezone: America/New_York
contact:
  name: Dana Whitaker
  email: facilities@tallpines.example.org

feeds:
  buildings:
    contract: buildings@1
    files: "Facilities*.csv"
    format: {type: csv, encoding: utf-8}
    columns:
      Bldg Code: building_code
      Building Name: building_name
      Type: building_type
      Beds: capacity
      Year Built: year_built
    values:
      building_type:
        Cabin: cabin
        Dining Hall: dining
        Waterfront: waterfront
        Program: program
        Office: admin
        Health Center: health
        Maint Shop: maintenance
        Camp Store: store
        Other: other

  assets:
    contract: assets@2
    files: "Equipment List*.xlsx"
    format: {type: excel, sheet: Equipment, header_row: 3}
    columns:
      "Tag #": asset_tag
      Description: asset_name
      System: category
      Location: building_code
      Purchased: purchased_on
      Cost: purchase_cost
      Condition: status
    values:
      category:
        HVAC: hvac
        Plumbing: plumbing
        Electrical: electrical
        Boats: watercraft
        Kitchen: kitchen
        Vehicles: vehicle
        Rec: recreation
        Grounds: grounds
        Safety: safety
      status:
        Good: in_service
        Needs Repair: needs_repair
        Down: out_of_service
        Retired: retired

  staff:
    contract: staff@1
    files: "Staff Roster*.csv"
    format: {type: csv, encoding: utf-8}
    columns:
      Employee ID: staff_code
      First: first_name
      Last: last_name
      Position: role
      Email: email
      Start Date: start_date
      Active?: is_active
    values:
      role:
        Director: director
        Maintenance: maintenance
        Lifeguard: waterfront
        Kitchen: kitchen
        Counselor: counselor
        Nurse: health
        Store: store
        Office: admin
    parse:
      date_formats: ["%m/%d/%Y"]

  commissary_transactions:
    contract: commissary_transactions@1
    files: "POS Export*.csv"
    format: {type: csv, encoding: utf-8}
    columns:
      "Receipt #": transaction_id
      Line: line_number
      Date/Time: sold_at
      Store: store_building_code
      Cashier: cashier_staff_code
      SKU: sku
      Item: item_name
      Category: item_category
      Qty: quantity
      Price: unit_price
      Tender: payment_method
    values:
      item_category:
        Snacks: snack
        Drinks: drink
        Apparel: apparel
        Toiletries: toiletries
        Supplies: supplies
        Souvenirs: souvenir
      payment_method:
        Camp Account: camper_account
        Cash: cash
        Card: card
    parse:
      timestamp_formats: ["%m/%d/%Y %I:%M %p"]
