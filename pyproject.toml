[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "campcommand-data-platform"
version = "0.1.0"
description = "Multi-tenant ingestion and warehouse for camp operations data"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.10,<1.13",
    "dbt-postgres>=1.9,<1.12",
    "faker>=30",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
snowflake = [
    "dbt-snowflake>=1.9,<1.13",
    "snowflake-sqlalchemy>=1.7",
]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.6",
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=3.2",
]

[project.scripts]
campcommand = "campcommand.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campcommand = ["templates/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["campcommand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Postgres warehouse"]
